# The server and its database on one machine: `docker compose up --build`,
# then the API answers on http://localhost:8787/.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: thisorthat
      POSTGRES_DB: thisorthat
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:thisorthat@db/thisorthat
    ports:
      - "8787:8787"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
