name: thisorthat
description: "This or That: pick one of two answers and see how everyone else voted."
publish_to: 'none'

# `X.Y.Z+N`. N is the store build number: it carries on from the last
# `versionCode` Google Play has seen (6, the native app) and both platforms of
# one release carry the same N.
version: 2.0.0+6

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Localization: `flutter_localizations` supplies the Material/Cupertino
  # strings per locale; `intl` backs the plural and number formatting that
  # gen_l10n generates from `lib/l10n/*.arb`.
  flutter_localizations:
    sdk: flutter
  intl: any

  # The API client. Every call goes through `lib/api/api_client.dart`.
  http: ^1.6.0

  # Finds the directory the auth token and the onboarding answers live in.
  # On Android it is the native app's `filesDir`, so an upgraded install keeps
  # its token.
  path_provider: ^2.1.6

  # OS share sheet for the question picture.
  share_plus: ^13.3.1

  # The mock-up's icons are Feather SVGs; drawn from their original paths so
  # both platforms show the same stroke.
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  # Generates `lib/l10n/app_localizations*.dart` from the `.arb` files on
  # every `pub get` / build — configured in `l10n.yaml`.
  generate: true

  uses-material-design: true

  # The two families of the mock-up, bundled so the first launch needs no
  # network and both platforms draw the same face. Both cover Cyrillic.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-Bold.ttf
          weight: 700
        - asset: assets/fonts/Unbounded-Black.ttf
          weight: 900
